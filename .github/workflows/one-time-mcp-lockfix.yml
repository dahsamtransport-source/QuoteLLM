name: One-time compatible MCP dependency lock repair
on:
  push:
    branches: [security/quotellm-api-bounds-20261114]
    paths: ['.github/workflows/one-time-mcp-lockfix.yml']
permissions:
  contents: write
jobs:
  update-mcp-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Repair compatible transitive MCP vulnerabilities without --force
        working-directory: mcp
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reject any manifest change, test locked npm dependency build and audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- mcp/package.json web/package.json
          npm ci --prefix mcp --ignore-scripts
          npm run build --prefix mcp
          npm audit --prefix mcp --audit-level=moderate
      - name: Commit only updated lockfile on this isolated review branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add mcp/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(deps): update MCP transitive security fixes within locked manifest'
            git push origin 'HEAD:security/quotellm-api-bounds-20261114'
          fi
