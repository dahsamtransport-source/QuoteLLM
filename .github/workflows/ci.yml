name: QuoteLLM validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [web, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - if: matrix.project == 'web'
        run: node node_modules/typescript/bin/tsc -p ../tsconfig.api.json
      - if: matrix.project == 'web'
        run: node --test ../tests/api.test.mjs
      - if: matrix.project == 'mcp'
        run: npm audit --audit-level=moderate
